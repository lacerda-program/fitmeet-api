server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bootcamp_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: bootcamp07-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000

aws:
  s3:
    endpoint: http://localhost:4566
    bucket-name: bootcamp-bucket
    region: us-east-1
    access-key: test
    secret-key: test

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
